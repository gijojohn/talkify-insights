<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkify.life | Pro Insights 2026</title>
    <script async src="//www.instagram.com/embed.js"></script>
    <style>
        :root { --sage: #8e9a9b; --cream: #fafafa; --text: #4a4a4a; --white: #ffffff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--cream); color: var(--text); padding: 20px; margin: 0; }
        .header { text-align: center; margin-bottom: 30px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 25px; max-width: 1400px; margin: 0 auto; }
        /* Added cursor pointer to make the card feel interactive */
        .card { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); }
        
        .media-box { width: 100%; height: 480px; background: #000; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Ensure the link covers the whole media box */
        .media-link { display: block; width: 100%; height: 100%; }

        .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 15px; }
        .stat-box { background: #f9f9f9; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #f0f0f0; }
        .stat-val { display: block; font-size: 14px; font-weight: 700; color: #333; }
        .stat-lab { display: block; font-size: 8px; color: #999; text-transform: uppercase; }
        
        .eng-box { background: #eef7f7; border-color: #d1e5e5; grid-column: span 3; padding: 12px; }
        .eng-box .stat-val { color: var(--sage); font-size: 18px; }

        .time-row { font-size: 11px; color: #888; padding: 12px 15px; display: flex; justify-content: space-between; background: #fafafa; border-top: 1px solid #eee; }
        .btn { padding: 10px 20px; border-radius: 25px; border: 1px solid var(--sage); background: white; cursor: pointer; color: var(--sage); font-size: 11px; font-weight: 600; text-transform: uppercase; margin: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Talkify.life Full Account Insights</h2>
        <div style="display:flex; justify-content:center; gap:10px;">
            <button class="btn" onclick="downloadCSV()">📥 Download CSV</button>
            <button class="btn" onclick="fetchAllData()">🔄 Load Entire History</button>
        </div>
    </div>

    <div id="instagram-feed" class="grid">Syncing elite metrics...</div>

    <script>
        // Keep your existing token and ID
        const token = "EAAMl7RTdN68BQ7i9KFrm2o3OmxUuGbCX3NFpHuSFZAptxZCMKBlEzbfQwep0J29ZCuL9mDPoz279rgNAl8r7aZB1WPiVW0jUyve1sSwf7XEm5OMXoEruqysZA3U1llPntt7HPxMXXKqbHZB079uPma3WplV9TIXZAn8rEgZCwVL1KBDAmjGkuplm7yb72QZDZD";
        const igID = "17841476281000322";
        let currentData = [];

        async function fetchAllData() {
            let nextUrl = `https://graph.facebook.com/v22.0/${igID}/media?fields=id,caption,media_type,media_url,permalink,thumbnail_url,like_count,comments_count,timestamp,insights.metric(views,reach,saved,shares,profile_visits,ig_reels_avg_watch_time),children{media_url,media_type}&limit=50&access_token=${token}`;
            currentData = [];

            try {
                while (nextUrl) {
                    const response = await fetch(nextUrl).then(r => r.json());
                    if (response.data) {
                        const batch = response.data.map(post => {
                            const m = (name) => post.insights?.data.find(i => i.name === name)?.values[0].value || 0;
                            const reach = m('reach');
                            const views = m('views') || m('plays');
                            const interactions = (post.like_count || 0) + (post.comments_count || 0) + m('saved') + m('shares');
                            const d = new Date(post.timestamp);
                            
                            return {
                                ...post, reach, views,
                                istDate: d.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric' }),
                                istTime: d.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true }),
                                saved: m('saved'),
                                shares: m('shares'),
                                profileVisits: m('profile_visits'),
                                hookRate: reach > 0 ? ((views / reach) * 100).toFixed(1) : 0,
                                engagementRate: reach > 0 ? ((interactions / reach) * 100).toFixed(2) : 0
                            };
                        });
                        currentData = [...currentData, ...batch];
                        renderFeed(currentData);
                    }
                    nextUrl = response.paging && response.paging.next ? response.paging.next : null;
                }
            } catch (err) { console.error("History Error", err); }
        }

        function renderFeed(data) {
            const container = document.getElementById('instagram-feed');
            container.innerHTML = '';
            data.forEach(p => {
                const isVideo = p.media_type === 'VIDEO';
                
                let mediaHtml;
                // Check for children (Carousel) first, then regular URL
                const displayImg = (p.media_type === 'CAROUSEL_ALBUM' && p.children) ? p.children.data[0].media_url : (p.media_url || p.thumbnail_url);

                if (isVideo) {
                    mediaHtml = `<video muted loop playsinline poster="${p.thumbnail_url || p.media_url}"><source src="${p.media_url}" type="video/mp4"></video>`;
                } else {
                    mediaHtml = `<img src="${displayImg}" alt="Talkify Content">`;
                }

                container.innerHTML += `
                    <div class="card" onclick="window.open('${p.permalink}', '_blank')">
                        <div class="media-box">
                            <a href="${p.permalink}" target="_blank" class="media-link" onclick="event.stopPropagation();">
                                ${mediaHtml}
                            </a>
                        </div>
                        <div class="metric-grid">
                            <div class="stat-box"><span class="stat-val">❤️ ${p.like_count}</span><span class="stat-lab">Likes</span></div>
                            <div class="stat-box"><span class="stat-val">📤 ${p.shares}</span><span class="stat-lab">Shares</span></div>
                            <div class="stat-box"><span class="stat-val">🔖 ${p.saved}</span><span class="stat-lab">Saves</span></div>
                            
                            <div class="stat-box"><span class="stat-val">👥 ${p.reach.toLocaleString()}</span><span class="stat-lab">Reach</span></div>
                            <div class="stat-box"><span class="stat-val">👁️ ${p.views.toLocaleString()}</span><span class="stat-lab">Views</span></div>
                            <div class="stat-box"><span class="stat-val">🏠 ${p.profileVisits}</span><span class="stat-lab">Prof. Visits</span></div>
                            
                            <div class="stat-box" style="background: #fffbe6;"><span class="stat-val">🪝 ${p.hookRate}%</span><span class="stat-lab">Hook Rate</span></div>
                            
                            <div class="stat-box eng-box"><span class="stat-val">${p.engagementRate}%</span><span class="stat-lab">Engagement Rate</span></div>
                        </div>
                        <div class="time-row"><span>📅 <strong>${p.istDate}</strong></span><span>🕒 <strong>${p.istTime} IST</strong></span></div>
                    </div>`;
            });
        }

        function downloadCSV() {
            const headers = ["ID", "Date", "Time", "Type", "Reach", "Views", "Likes", "Shares", "Saves", "ProfVisits", "HookRate", "EngRate", "Caption"];
            const rows = currentData.map(p => [
                p.id, p.istDate, p.istTime, p.media_type, p.reach, p.views, 
                p.like_count, p.shares, p.saved, p.profileVisits, p.hookRate, p.engagementRate,
                `"${(p.caption || "").replace(/"/g, '""').replace(/\n/g, ' ')}"`
            ]);
            const csv = [headers, ...rows].map(e => e.join(",")).join("\n");
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            link.download = "Talkify_Elite_Analytics.csv";
            link.click();
        }

        document.addEventListener("DOMContentLoaded", fetchAllData);
    </script>
</body>
</html>
